spring.application.name=backend

# ---------------------------------------------------------------------------
# Puerto: local 8080 | Render inyecta PORT automáticamente
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos: PostgreSQL (Neon)
# ---------------------------------------------------------------------------
# Por defecto: H2 en memoria (local). Para PostgreSQL/Neon define las variables SPRING_DATASOURCE_* en el entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cointribedb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
# El dialecto se autodetecta; en Postgres puedes fijarlo con SPRING_JPA_DATABASE_PLATFORM.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (deshabilitado en producción con Postgres)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Evita fallos si el pool tarda en conectar a Neon (cold start)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
